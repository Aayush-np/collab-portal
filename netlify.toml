[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18.17.0"

# Redirect API calls to backend
[[redirects]]
  from = "/api/*"
  to = "https://collab-portal-api.onrender.com/api/:splat"
  status = 200
  force = true

# Redirect socket.io connections
[[redirects]]
  from = "/socket.io/*"
  to = "https://collab-portal-api.onrender.com/socket.io/:splat"
  status = 200
  force = true

# SPA fallback - all other routes go to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
